# Render Blueprint: https://render.com/docs/blueprint-spec
# In the Render dashboard: New -> Blueprint -> select this repo, and Render
# reads this file to create the web service + database automatically.
services:
  - type: web
    name: signalloop-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn puzzle_backend.wsgi:application"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend.vercel.app"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: signalloop-db
          property: connectionString

databases:
  - name: signalloop-db
    plan: free
